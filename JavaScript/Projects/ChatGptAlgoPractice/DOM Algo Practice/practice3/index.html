<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <script src="app.js" defer></script>
    <link rel="stylesheet" href="style.css">
    <title>Document</title>
</head>
<body>

    <h1>Sort Cards</h1>
    
    <div class="button-container">
        <button id="price-sort">Sort by Price</button>
        <button id="name-sort">Sort by Name</button>
    </div>

    <div id="cards-container">
        <div class="card">
            <p class="prod-name">shirt</p>
            <p class="price">44.55</p>
        </div>
        
        <div class="card">
            <p class="prod-name">jeans</p>
            <p class="price">44.29</p>
        </div>
        
        <div class="card">
            <p class="prod-name">bracelet</p>
            <p class="price">12.00</p>
        </div>
        
        <div class="card">
            <p class="prod-name">cap</p>
            <p class="price">35.00</p>
        </div>
        
        <div class="card">
            <p class="prod-name">ring</p>
            <p class="price">7.50</p>
        </div>
    </div>



    <p class="sort-info">
        All products sorted in descending order, from left to right
    </p>
</body>
</html>
