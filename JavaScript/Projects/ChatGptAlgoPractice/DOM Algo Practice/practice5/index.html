<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <script src="app.js" defer></script>
    <link rel="stylesheet" href="style.css">
    <title>Document</title>
</head>

<body>

    <h1>Sort Cards</h1>

    <div class="filter-container">
        <input type="text" placeholder="search here">


        <label for="range-slider">Select a value:</label>
        <input type="range" id="range-slider" name="range-slider" min="0" max="5" step="0.5" value="2.5"
            list="tickmarks">

        <datalist id="tickmarks">
            <option value="0" label="0">
            <option value="1" label="1">
            <option value="2" label="2">
            <option value="3" label="3">
            <option value="4" label="4">
            <option value="5" label="5">
        </datalist>


    </div>

    <div id="cards-container">
        <div class="card">
            <p class="prod-name">bracelet</p>
            <p class="price">12.00</p>
        </div>

        <div class="card">
            <p class="prod-name">jeans</p>
            <p class="price">44.29</p>
        </div>

        <div class="card">
            <p class="prod-name">cap</p>
            <p class="price">35.00</p>
        </div>

        <div class="card">
            <p class="prod-name">dress</p>
            <p class="price">44.55</p>
        </div>

        <div class="card">
            <p class="prod-name">ring</p>
            <p class="price">7.50</p>
        </div>


        <p id="no-match-text" style="display: none">
            No Match Found
        </p>
        <!-- The above text is shown if there is no matches from search -->
    </div>


</body>

</html>
