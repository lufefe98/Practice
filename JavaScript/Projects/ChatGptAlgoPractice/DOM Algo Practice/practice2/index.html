<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <script src="app.js" defer></script>
    <link rel="stylesheet" href="style.css">
    <title>Document</title>
</head>
<body>

    <h1>Sort Cards</h1>
    
    <div class="button-container">
        <button id="price-sort">Sort by Price</button>
        <button id="name-sort">Sort by Name</button>
    </div>

    <div id="cards-container">
        <div class="card">
            <p class="prod-name">soup</p>
            <p class="price">5.50</p>
        </div>
        
        <div class="card">
            <p class="prod-name">soap</p>
            <p class="price">4.00</p>
        </div>
        
        <div class="card">
            <p class="prod-name">rice</p>
            <p class="price">10.00</p>
        </div>
        
        <div class="card">
            <p class="prod-name">bread</p>
            <p class="price">3.00</p>
        </div>
        
        <div class="card">
            <p class="prod-name">chips</p>
            <p class="price">3.50</p>
        </div>
    </div>



    <p class="sort-info">
        All products sorted in ascending order, from left to right
    </p>
</body>
</html>
