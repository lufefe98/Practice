<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Movie Explorer Filter</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <h1>🎬 Movie Explorer</h1>
  </header>

  <section class="filters">
    <div class="filter-group">
      <label for="genre-filter">Genre:</label>
      <select id="genre-filter">
        <option value="">All</option>
        <option value="action">Action</option>
        <option value="comedy">Comedy</option>
        <option value="drama">Drama</option>
        <option value="sci-fi">Sci-Fi</option>
      </select>
    </div>

    <div class="filter-group">
      <label for="rating-filter">Max Rating:</label>
      <input type="number" id="rating-filter" min="0" max="10" step="0.1" placeholder="e.g. 8.5" />
    </div>

    <div class="filter-group">
      <label for="search-filter">Search Title:</label>
      <input type="text" id="search-filter" placeholder="Enter movie title..." />
    </div>
  </section>

  <main class="movie-list">
    <div class="card" data-genre="action">
      <h3 class="movie-title">Inception</h3>
      <p class="movie-rating">8.8</p>
    </div>
    
    <div class="card" data-genre="comedy">
      <h3 class="movie-title">The Mask</h3>
      <p class="movie-rating">6.9</p>
    </div>

    <div class="card" data-genre="drama">
      <h3 class="movie-title">The Shawshank Redemption</h3>
      <p class="movie-rating">9.3</p>
    </div>

    <div class="card" data-genre="sci-fi">
      <h3 class="movie-title">Interstellar</h3>
      <p class="movie-rating">8.6</p>
    </div>

    <div class="card" data-genre="action">
      <h3 class="movie-title">The Dark Knight</h3>
      <p class="movie-rating">9.0</p>
    </div>

    <div class="card" data-genre="comedy">
      <h3 class="movie-title">Superbad</h3>
      <p class="movie-rating">7.6</p>
    </div>

    <div class="card" data-genre="drama">
      <h3 class="movie-title">Fight Club</h3>
      <p class="movie-rating">8.8</p>
    </div>
  </main>

  <p id="no-results" class="hidden">No movies found.</p>

  <script src="app.js" defer></script>
</body>
</html>
